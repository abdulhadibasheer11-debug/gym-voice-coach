name: assets-probe
on:
  push:
    branches: [assets-probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/fedb.py
      - run: |
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          git add probe/out2 && git commit -m "probe fedb" && git push
